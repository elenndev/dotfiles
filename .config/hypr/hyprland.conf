
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$wallpaperPicker = ~/scripts/wallpaper-picker

# monitor 
monitor = ,preferred,auto,1

# start programs
exec-once = waybar

# input
input {
    kb_layout = us,br
    kb_variant =
    kb_model = pc105
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# Layout
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1

    col.active_border = rgb(5c8fd6)
    col.inactive_border = rgb(3a3a3a)

    layout = dwindle
    allow_tearing = false
}

dwindle {
    preserve_split = true
}

# style 
decoration {
    rounding = 6

    active_opacity = 0.96
    inactive_opacity = 0.90

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# minimal animations
animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 2, linear
    animation = windowsOut, 1, 2, linear
    animation = border, 1, 1, linear
    animation = fade, 1, 2, linear
    animation = workspaces, 1, 2, linear
}


# apps
bind = $mainMod, RETURN, exec, $terminal
# normal rofi menu
bind = $mainMod, D, exec, $menu
# wallpaper picker menu
bind = $mainMod SHIFT, D, exec, $wallpaperPicker

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, L, exec, hyprlock

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move windows to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# navegation — H/J/K + ;
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, SEMICOLON, movefocus, r

# move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, SEMICOLON, movewindow, r

# move windows focus
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, J, resizeactive, 0 50
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, SEMICOLON, resizeactive, 50 0

#  keyboard layout
bind = $mainMod SHIFT, P, exec, hyprctl keyword input:kb_layout br
bind = $mainMod SHIFT, U, exec, hyprctl keyword input:kb_layout us

# Screenshots
# Print → screenshot full screen to clipboard
bind = , PRINT, exec, grim -g "$(slurp -o)" /tmp/screenshot.png && wl-copy < /tmp/screenshot.png

# Super + Print → select area to clipboard
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" /tmp/screenshot.png && wl-copy < /tmp/screenshot.png

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-hy
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Wallpaper
exec-once = swww-daemon
exec-once = sleep 1 && usewallpaper 1
