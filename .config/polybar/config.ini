[bar/main]
width = 100%
height = 28

background = #282828
foreground = #ebdbb2

font-0 = "FiraCode Nerd Font Mono:size=10"
font-1 = "Noto Color Emoji:size=10"

modules-left = i3
modules-center = date
modules-right = music sep volume sep battery

wm-restack = i3

[module/sep]
type = custom/text
content = "  "


[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

label-focused = %name%
label-focused-background = #3c3836
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = #504945
label-visible-padding = 1


[module/date]
type = internal/date
interval = 5

date = %H:%M
label = %date%

[module/music]
type = custom/script
exec = playerctl metadata --format "  {{artist}} - {{title}}"
interval = 2

[module/volume]
type = internal/alsa

format-volume = <label-volume>
label-volume =  %percentage%
label-muted =  muted
click-right = pavucontrol


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98

format = <label>

label-charging = %percentage%%
label-discharging =  %percentage%%
label-full = 
